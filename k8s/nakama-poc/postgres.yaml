apiVersion: v1
kind: Namespace
metadata:
  name: nakama-poc
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: nakama-poc
type: Opaque
stringData:
  POSTGRES_USER: nakama
  POSTGRES_PASSWORD: nakama-poc-local
  POSTGRES_DB: nakama_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: nakama-poc
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nakama-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nakama-poc
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
